
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vonage Client Observability</title>
  <script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: gray;
      color: #111;
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
    }

    /* ── Header — Get Stats button only ── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 16px;
      background: #000;
      z-index: 10;
    }

    /* ── Get Stats button ── */
    #stats-toggle-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 14px; border: 1px solid #444;
      border-radius: 5px; background: #1a1a1a;
      color: #e2e8f0; font-size: 0.72rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      letter-spacing: 0.3px; font-family: Arial, Helvetica, sans-serif;
    }
    #stats-toggle-btn:hover { background: #2a2a2a; border-color: #666; }
    #stats-toggle-btn .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #666;
      transition: background 0.2s;
    }
    #stats-toggle-btn.active .dot {
      background: #10b981; box-shadow: 0 0 5px rgba(16,185,129,0.6);
    }

    /* ── Main video area ── */
    .video-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: gray;
    }

    /* Subscriber — full screen */
    #subscriber {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 10;
    }

    /* Waiting placeholder */
    .waiting-msg {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: #fff; font-size: 0.8rem;
      pointer-events: none; z-index: 1;
    }
    .waiting-msg svg { opacity: 0.4; }
    .waiting-msg.hidden { display: none; }

    /* Publisher — PiP bottom-left, matching Vonage sample style */
    #publisher {
      position: absolute;
      bottom: 10px; left: 10px;
      width: 360px; height: 240px;
      border: 3px solid white;
      border-radius: 3px;
      z-index: 100;
      background: #000;
    }

    /* ── Condition banners — float top of video ── */
    .banners-overlay {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 20; pointer-events: none;
    }
    .condition-banner {
      display: none;
      padding: 6px 12px; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.3px; border-radius: 5px; pointer-events: auto;
    }
    .condition-banner.warning  { display: block; background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.4); border-left: 3px solid #f59e0b; }
    .condition-banner.critical { display: block; background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.4);  border-left: 3px solid #ef4444; }
    .condition-banner.serious  { display: block; background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.4); border-left: 3px solid #f59e0b; }

    /* ── Video controls — inside publisher PiP ── */
    .video-controls {
      position: absolute;
      bottom: 13px; left: 10px;
      display: flex; gap: 8px; z-index: 110;
    }
    .video-controls button {
      padding: 4px 10px; border: none; border-radius: 4px;
      font-size: 0.65rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; letter-spacing: 0.3px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .video-controls button:hover { opacity: 0.85; }
    #publish-video-true  { background: rgba(16,185,129,0.9); color: #000; display: none; }
    #publish-video-false { background: rgba(239,68,68,0.9);  color: #fff; }

    /* ══════════════════════════════════════════
       STATS DRAWER — slides up from bottom
    ══════════════════════════════════════════ */
    .stats-drawer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 300px;
      background: #fff;
      border-top: 2px solid #ccc;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      z-index: 200;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .stats-drawer.open { transform: translateY(0); }

    /* Drawer header */
    .drawer-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px;
      background: #000;
      border-bottom: 1px solid #333;
    }
    .drawer-header-left { display: flex; align-items: center; gap: 14px; }
    .drawer-title {
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8;
    }

    /* Tab bar */
    .drawer-tabs { display: flex; gap: 3px; }
    .drawer-tab {
      padding: 3px 12px; border-radius: 4px; border: none;
      background: transparent; color: #64748b;
      font-size: 0.67rem; font-weight: 600; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.4px;
      transition: background 0.15s, color 0.15s;
      font-family: Arial, Helvetica, sans-serif;
    }
    .drawer-tab:hover  { background: #1a1a1a; color: #e2e8f0; }
    .drawer-tab.active { background: #1a1a1a; color: #fff; }

    /* Close button */
    .drawer-close {
      background: none; border: none; color: #64748b;
      font-size: 1rem; cursor: pointer; padding: 2px 6px;
      border-radius: 3px; line-height: 1;
    }
    .drawer-close:hover { color: #fff; background: #1a1a1a; }

    /* Drawer body */
    .drawer-body { flex: 1; overflow: hidden; position: relative; background: #fff; }
    .tab-panel   { display: none; height: 100%; }
    .tab-panel.active { display: block; }

    /* Stats grid inside panels */
    .stats-grid { display: grid; height: 100%; }
    .stats-grid-pub { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .stats-grid-sub { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .stats-section {
      padding: 10px 12px;
      border-right: 1px solid #e2e8f0;
      overflow-y: auto;
    }
    .stats-section:last-child { border-right: none; }

    .stats-section h3 {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px;
      color: #64748b; margin-bottom: 8px; padding-bottom: 5px;
      border-bottom: 1px solid #e2e8f0;
      position: sticky; top: 0;
      background: #fff; z-index: 1; font-weight: 700;
    }

    /* Stat rows */
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0; font-size: 0.7rem;
      border-bottom: 1px solid #f1f5f9; gap: 8px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #475569; flex: 1; line-height: 1.4; }
    .stat-value {
      color: #111; font-weight: 600;
      font-family: 'Courier New', monospace; font-size: 0.68rem; text-align: right;
    }
    .sub-heading {
      font-size: 0.6rem; color: #94a3b8; margin: 8px 0 3px;
      text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
      padding-bottom: 3px; border-bottom: 1px solid #e2e8f0;
    }
    .sub-heading:first-child { margin-top: 0; }

    /* Badges */
    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-excellent   { background: #dcfce7; color: #15803d; }
    .badge-good        { background: #dcfce7; color: #15803d; }
    .badge-fair        { background: #fef9c3; color: #a16207; }
    .badge-warning     { background: #ffedd5; color: #c2410c; }
    .badge-critical    { background: #fee2e2; color: #b91c1c; }
    .badge-unknown     { background: #f1f5f9; color: #64748b; }
    .badge-none        { background: #dcfce7; color: #15803d; }
    .badge-local       { background: #ffedd5; color: #c2410c; }
    .badge-remote      { background: #fee2e2; color: #b91c1c; }
    .badge-both        { background: #fee2e2; color: #b91c1c; }
    .badge-bandwidth   { background: #fef9c3; color: #a16207; }
    .badge-packet-loss { background: #fee2e2; color: #b91c1c; }
    .badge-nominal     { background: #dcfce7; color: #15803d; }
    .badge-serious     { background: #ffedd5; color: #c2410c; }

    /* Placeholder */
    .no-stats { color: #94a3b8; font-size: 0.7rem; text-align: center; padding: 16px 0; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- ── Header — Get Stats button only ── -->
  <div class="header">
    <button id="stats-toggle-btn">
      <span class="dot"></span>
      Get Stats
    </button>
  </div>

  <!-- ── Main video area ── -->
  <div class="video-area">

    <!-- Subscriber — full screen -->
    <div id="subscriber"></div>

    <!-- Waiting placeholder -->
    <div class="waiting-msg" id="waiting-msg">
      <svg width="52" height="52" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      </svg>
      Waiting for remote participant...
    </div>

    <!-- Publisher — PiP bottom-left (Vonage sample style) -->
    <div id="publisher"></div>

    <!-- Disable/Enable video — overlaid inside publisher PiP -->
    <div class="video-controls">
      <button id="publish-video-true">Enable Video</button>
      <button id="publish-video-false">Disable Video</button>
    </div>

    <!-- Condition banners overlay -->
    <div class="banners-overlay">
      <div id="pub-condition-banner" class="condition-banner"></div>
      <div id="sub-condition-banner" class="condition-banner"></div>
      <div id="cpu-condition-banner" class="condition-banner"></div>
    </div>

    <!-- ══════════════════════════════════════════
         STATS DRAWER — slides up on "Get Stats"
    ══════════════════════════════════════════ -->
    <div class="stats-drawer" id="stats-drawer">

      <div class="drawer-header">
        <div class="drawer-header-left">
          <div class="drawer-tabs">
            <button class="drawer-tab active" data-tab="pub">Publisher Stats</button>
            <button class="drawer-tab" data-tab="sub">Subscriber Stats</button>
            <button class="drawer-tab" data-tab="sender">Sender-Side Stats</button>
          </div>
        </div>
        <button class="drawer-close" id="drawer-close-btn" title="Close">✕</button>
      </div>

      <div class="drawer-body">

        <!-- Publisher Stats tab -->
        <div class="tab-panel active" id="tab-pub">
          <div class="stats-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">

            <div class="stats-section">
              <h3>Audio</h3>
              <div id="pub-audio-stats"><p class="no-stats">Waiting...</p></div>
            </div>

            <div class="stats-section">
              <h3>Video</h3>
              <div id="pub-video-stats"><p class="no-stats">Waiting...</p></div>
            </div>

            <div class="stats-section">
              <h3>Network Condition</h3>
              <div id="pub-network-stats"><p class="no-stats">Waiting...</p></div>
            </div>

            <div class="stats-section">
              <h3>CPU Performance <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:0.58rem;color:#94a3b8">— Chromium only</span></h3>
              <div id="cpu-stats"><p class="no-stats">Waiting...</p></div>
            </div>

          </div>
        </div>

        <!-- Subscriber Stats tab -->
        <div class="tab-panel" id="tab-sub">
          <div class="stats-grid" style="grid-template-columns: 1fr 1fr 1fr;">

            <div class="stats-section">
              <h3>Audio</h3>
              <div id="sub-audio-stats"><p class="no-stats">Waiting...</p></div>
            </div>

            <div class="stats-section">
              <h3>Video</h3>
              <div id="sub-video-stats"><p class="no-stats">Waiting...</p></div>
            </div>

            <div class="stats-section">
              <h3>Network Condition</h3>
              <div id="sub-network-stats"><p class="no-stats">Waiting...</p></div>
            </div>

          </div>
        </div>

        <!-- Sender-Side Stats tab -->
        <div class="tab-panel" id="tab-sender">
          <div class="stats-grid" style="grid-template-columns: 1fr;">

            <div class="stats-section">
              <h3>Sender-Side</h3>
              <div id="sub-sender-stats"><p class="no-stats">Waiting...</p></div>
            </div>

          </div>
        </div>

      </div><!-- /drawer-body -->
    </div><!-- /stats-drawer -->

  </div><!-- /video-area -->

  <script>
    // ── Drawer open / close ──
    const drawer    = document.getElementById('stats-drawer');
    const toggleBtn = document.getElementById('stats-toggle-btn');
    const closeBtn  = document.getElementById('drawer-close-btn');

    function openDrawer()  { drawer.classList.add('open');    toggleBtn.classList.add('active'); }
    function closeDrawer() { drawer.classList.remove('open'); toggleBtn.classList.remove('active'); }

    toggleBtn.addEventListener('click', () =>
      drawer.classList.contains('open') ? closeDrawer() : openDrawer()
    );
    closeBtn.addEventListener('click', closeDrawer);

    // ── Tab switching ──
    document.querySelectorAll('.drawer-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    // ── Hide waiting message when subscriber connects ──
    window.setSubscriberActive = (active) => {
      const msg = document.getElementById('waiting-msg');
      if (active) msg.classList.add('hidden');
      else        msg.classList.remove('hidden');
    };
  </script>

  <script type="text/javascript" src="js/config.js"></script>
  <script type="text/javascript" src="js/app.js"></script>
</body>
</html>
